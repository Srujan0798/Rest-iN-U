apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: restinu-production

resources:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: production

patches:
  # Production replicas
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  # Production HPA settings
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target:
      kind: HorizontalPodAutoscaler
      name: frontend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  # Increase resources for production
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "200m"
            memory: "384Mi"
          limits:
            cpu: "800m"
            memory: "768Mi"

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - cors-origins=https://restinu.com,https://www.restinu.com
      - log-level=info
  - name: frontend-config
    behavior: merge
    literals:
      - api-url=https://api.restinu.com
      - ws-url=wss://api.restinu.com

images:
  - name: ghcr.io/restinu/restinu-backend
    newTag: production-latest
  - name: ghcr.io/restinu/restinu-frontend
    newTag: production-latest

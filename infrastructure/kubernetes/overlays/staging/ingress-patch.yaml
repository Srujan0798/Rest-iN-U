apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staging-restinu-ingress
  namespace: restinu-staging
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - staging.restinu.com
        - api-staging.restinu.com
      secretName: staging-restinu-tls
  rules:
    - host: staging.restinu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: staging-frontend
                port:
                  number: 80
    - host: api-staging.restinu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: staging-backend
                port:
                  number: 80

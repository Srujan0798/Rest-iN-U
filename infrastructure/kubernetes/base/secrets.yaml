# NOTE: This is a template. In production, use sealed-secrets, external-secrets,
# or a secrets management tool like HashiCorp Vault.
# DO NOT commit actual secret values to version control!

apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: restinu
  labels:
    app: backend
type: Opaque
stringData:
  # Replace these with actual values or use external secrets management
  database-url: "postgresql://user:password@postgres:5432/restinu"
  redis-url: "redis://redis:6379"
  jwt-secret: "REPLACE_WITH_SECURE_SECRET"
  jwt-refresh-secret: "REPLACE_WITH_SECURE_REFRESH_SECRET"
  sentry-dsn: ""
  google-maps-api-key: ""
  stripe-secret-key: ""
  sendgrid-api-key: ""
  aws-access-key-id: ""
  aws-secret-access-key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
  namespace: restinu
  labels:
    app: frontend
type: Opaque
stringData:
  google-maps-api-key: ""
  stripe-publishable-key: ""
  sentry-dsn: ""

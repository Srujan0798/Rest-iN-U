# Test Coverage Reporting
# Runs tests, generates coverage reports, and comments on PRs

name: Test Coverage

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**/*.ts'
      - 'frontend/**/*.tsx'
      - 'backend/**/*.ts'
      - '!**/*.md'

  push:
    branches: [main]
    paths:
      - 'frontend/**/*.ts'
      - 'frontend/**/*.tsx'
      - 'backend/**/*.ts'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ============================================================================
  # Frontend Coverage
  # ============================================================================
  frontend-coverage:
    name: Frontend Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests with coverage
        id: coverage
        run: |
          npm run test:coverage -- --json --outputFile=coverage-report.json 2>&1 | tee test-output.txt || true

          # Extract coverage percentages
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(cat coverage/coverage-summary.json | jq -r '.total.lines.pct')
            STATEMENTS=$(cat coverage/coverage-summary.json | jq -r '.total.statements.pct')
            BRANCHES=$(cat coverage/coverage-summary.json | jq -r '.total.branches.pct')
            FUNCTIONS=$(cat coverage/coverage-summary.json | jq -r '.total.functions.pct')

            echo "lines=$LINES" >> $GITHUB_OUTPUT
            echo "statements=$STATEMENTS" >> $GITHUB_OUTPUT
            echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
            echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
          else
            echo "lines=0" >> $GITHUB_OUTPUT
            echo "statements=0" >> $GITHUB_OUTPUT
            echo "branches=0" >> $GITHUB_OUTPUT
            echo "functions=0" >> $GITHUB_OUTPUT
          fi

          # Check for test failures
          if grep -q "Tests:.*failed" test-output.txt; then
            echo "tests_passed=false" >> $GITHUB_OUTPUT
          else
            echo "tests_passed=true" >> $GITHUB_OUTPUT
          fi
        working-directory: frontend
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
        if: always()

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const lines = '${{ steps.coverage.outputs.lines }}';
            const statements = '${{ steps.coverage.outputs.statements }}';
            const branches = '${{ steps.coverage.outputs.branches }}';
            const functions = '${{ steps.coverage.outputs.functions }}';
            const testsPassed = '${{ steps.coverage.outputs.tests_passed }}' === 'true';

            // Coverage badge colors
            const getColor = (pct) => {
              const num = parseFloat(pct);
              if (num >= 80) return '🟢';
              if (num >= 60) return '🟡';
              return '🔴';
            };

            const statusEmoji = testsPassed ? '✅' : '❌';
            const statusText = testsPassed ? 'All tests passed' : 'Some tests failed';

            const comment = `## 📊 Frontend Test Coverage Report

${statusEmoji} **Status**: ${statusText}

### Coverage Summary

| Metric | Coverage | Status |
|--------|----------|--------|
| Lines | ${lines}% | ${getColor(lines)} |
| Statements | ${statements}% | ${getColor(statements)} |
| Branches | ${branches}% | ${getColor(branches)} |
| Functions | ${functions}% | ${getColor(functions)} |

### Coverage Thresholds
- 🟢 Good: >= 80%
- 🟡 Fair: >= 60%
- 🔴 Needs improvement: < 60%

---
*Coverage report generated by GitHub Actions*
`;

            // Check for existing coverage comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Frontend Test Coverage Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: comment
              });
            }

      - name: Check coverage thresholds
        if: github.event_name == 'pull_request'
        run: |
          LINES=${{ steps.coverage.outputs.lines }}
          THRESHOLD=50

          # Compare as integers (remove decimal)
          LINES_INT=${LINES%.*}

          if [ "$LINES_INT" -lt "$THRESHOLD" ]; then
            echo "⚠️ Coverage ($LINES%) is below threshold ($THRESHOLD%)"
            echo "Consider adding more tests to improve coverage"
            # Uncomment to fail the build:
            # exit 1
          else
            echo "✅ Coverage ($LINES%) meets threshold ($THRESHOLD%)"
          fi

  # ============================================================================
  # Backend Coverage (if backend tests exist)
  # ============================================================================
  backend-coverage:
    name: Backend Test Coverage
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'backend/') ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Check if backend has tests
        id: check_tests
        run: |
          if [ -f backend/package.json ]; then
            if grep -q '"test"' backend/package.json; then
              echo "has_tests=true" >> $GITHUB_OUTPUT
            else
              echo "has_tests=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_tests.outputs.has_tests == 'true'
        run: npm ci
        working-directory: backend

      - name: Run tests with coverage
        if: steps.check_tests.outputs.has_tests == 'true'
        id: coverage
        run: |
          npm run test:coverage 2>&1 | tee test-output.txt || true

          # Extract coverage if available
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(cat coverage/coverage-summary.json | jq -r '.total.lines.pct')
            echo "lines=$LINES" >> $GITHUB_OUTPUT
          else
            echo "lines=N/A" >> $GITHUB_OUTPUT
          fi
        working-directory: backend
        continue-on-error: true

      - name: Upload coverage artifact
        if: steps.check_tests.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ============================================================================
  # Coverage Summary
  # ============================================================================
  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [frontend-coverage, backend-coverage]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend-coverage
        continue-on-error: true

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend-coverage
        continue-on-error: true

      - name: Generate Summary
        run: |
          echo "## 📈 Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f frontend-coverage/coverage-summary.json ]; then
            FRONTEND_LINES=$(cat frontend-coverage/coverage-summary.json | jq -r '.total.lines.pct')
            echo "### Frontend: ${FRONTEND_LINES}% line coverage" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Frontend: No coverage data" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f backend-coverage/coverage-summary.json ]; then
            BACKEND_LINES=$(cat backend-coverage/coverage-summary.json | jq -r '.total.lines.pct')
            echo "### Backend: ${BACKEND_LINES}% line coverage" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Backend: No coverage data" >> $GITHUB_STEP_SUMMARY
          fi

# Auto Changelog Generation
# Automatically generates changelog from conventional commits on merge to main

name: Auto Changelog

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.0)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Get commits since last tag
        id: commits
        uses: actions/github-script@v7
        with:
          script: |
            // Get the latest tag
            let latestTag = null;
            try {
              const { data: tags } = await github.rest.repos.listTags({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 1
              });
              if (tags.length > 0) {
                latestTag = tags[0].name;
              }
            } catch (e) {
              console.log('No tags found');
            }

            // Get commits since last tag (or all commits if no tag)
            let commits;
            if (latestTag) {
              const { data: comparison } = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: latestTag,
                head: 'main'
              });
              commits = comparison.commits;
            } else {
              const { data: allCommits } = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: 'main',
                per_page: 100
              });
              commits = allCommits;
            }

            // Parse conventional commits
            const categories = {
              feat: { title: '✨ Features', commits: [] },
              fix: { title: '🐛 Bug Fixes', commits: [] },
              docs: { title: '📚 Documentation', commits: [] },
              style: { title: '💄 Styles', commits: [] },
              refactor: { title: '♻️ Refactoring', commits: [] },
              perf: { title: '⚡ Performance', commits: [] },
              test: { title: '🧪 Tests', commits: [] },
              build: { title: '📦 Build', commits: [] },
              ci: { title: '🔧 CI/CD', commits: [] },
              chore: { title: '🔨 Chores', commits: [] },
              other: { title: '📝 Other', commits: [] }
            };

            // Parse each commit
            commits.forEach(commit => {
              const message = commit.commit.message.split('\n')[0];
              const match = message.match(/^(\w+)(?:\(([^)]+)\))?:\s*(.+)$/);

              if (match) {
                const [, type, scope, description] = match;
                const category = categories[type] || categories.other;
                category.commits.push({
                  sha: commit.sha.substring(0, 7),
                  scope,
                  description,
                  author: commit.commit.author.name,
                  url: commit.html_url
                });
              } else {
                // Non-conventional commit
                categories.other.commits.push({
                  sha: commit.sha.substring(0, 7),
                  scope: null,
                  description: message,
                  author: commit.commit.author.name,
                  url: commit.html_url
                });
              }
            });

            return {
              latestTag,
              categories,
              totalCommits: commits.length
            };

      - name: Generate Changelog Content
        id: changelog
        uses: actions/github-script@v7
        with:
          script: |
            const data = ${{ steps.commits.outputs.result }};
            const date = new Date().toISOString().split('T')[0];
            const version = '${{ inputs.version }}' || `Unreleased (${date})`;

            let changelog = `## ${version}\n\n`;

            // Add each category that has commits
            Object.values(data.categories).forEach(category => {
              if (category.commits.length > 0) {
                changelog += `### ${category.title}\n\n`;
                category.commits.forEach(commit => {
                  const scope = commit.scope ? `**${commit.scope}**: ` : '';
                  changelog += `- ${scope}${commit.description} ([${commit.sha}](${commit.url}))\n`;
                });
                changelog += `\n`;
              }
            });

            // Add statistics
            changelog += `---\n`;
            changelog += `*${data.totalCommits} commits since ${data.latestTag || 'beginning'}*\n\n`;

            return changelog;

      - name: Read existing changelog
        id: existing
        run: |
          if [ -f CHANGELOG.md ]; then
            # Read everything after the first ## heading
            EXISTING=$(sed '1,/^## /d' CHANGELOG.md | head -c 50000)
            echo "content<<EOF" >> $GITHUB_OUTPUT
            echo "$EXISTING" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "content=" >> $GITHUB_OUTPUT
          fi

      - name: Write changelog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const newContent = ${{ steps.changelog.outputs.result }};
            const existing = `${{ steps.existing.outputs.content }}`;

            const header = `# Changelog

All notable changes to Rest-iN-U will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

`;
            const fullChangelog = header + newContent + (existing ? `## Previous Releases\n\n${existing}` : '');

            fs.writeFileSync('CHANGELOG.md', fullChangelog);
            console.log('Changelog written successfully');

      - name: Commit changelog
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet CHANGELOG.md; then
            echo "No changes to changelog"
          else
            git add CHANGELOG.md
            git commit -m "docs: update changelog [skip ci]"
            git push
          fi
